<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planes · ClubTrack</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="toast-area" style="position:fixed; top:16px; right:16px; z-index:2000;"></div>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="mark">CT</span><span class="name">ClubTrack</span>
      <span class="sub">Gestión de membresías y asistencia</span>
    </div>
    <nav>
      <div class="nav-section-label">PRINCIPAL</div>
      <a href="index.html" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="qr.html" class="nav-link"><i class="bi bi-qr-code"></i> Check-in QR</a>
      <div class="nav-section-label">CLUB</div>
      <a href="socios.html" class="nav-link"><i class="bi bi-people"></i> Socios</a>
      <a href="planes.html" class="nav-link"><i class="bi bi-card-list"></i> Planes</a>
      <a href="membresias.html" class="nav-link"><i class="bi bi-patch-check"></i> Membresías</a>
      <a href="actividades.html" class="nav-link"><i class="bi bi-calendar-week"></i> Actividades</a>
      <div class="nav-section-label">CONTROL</div>
      <a href="asistencia.html" class="nav-link"><i class="bi bi-clipboard-check"></i> Asistencia</a>
      <a href="pagos.html" class="nav-link"><i class="bi bi-cash-coin"></i> Pagos</a>
      <a href="vencimientos.html" class="nav-link"><i class="bi bi-exclamation-triangle"></i> Vencimientos</a>
    </nav>
    <div class="foot">ClubTrack v1.0<br>Proyecto académico</div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <div class="kicker">Club</div>
        <h1>Planes</h1>
        <p class="lead-sub">Catálogo de planes de membresía y sus condiciones.</p>
      </div>
      <button class="btn btn-amber" onclick="abrirNuevoPlan()"><i class="bi bi-plus-lg me-1"></i>Nuevo plan</button>
    </div>

    <div class="row g-3" id="grid-planes"></div>
  </main>
</div>

<div class="modal fade" id="modalPlan" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalPlanTitulo">Nuevo plan</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="form-plan" class="form-club">
        <div class="modal-body">
          <input type="hidden" id="plan-id">
          <div class="mb-3">
            <label>Nombre del plan</label>
            <input type="text" class="form-control" id="plan-nombre" required>
          </div>
          <div class="mb-3">
            <label>Descripción</label>
            <textarea class="form-control" id="plan-descripcion" rows="2"></textarea>
          </div>
          <div class="row">
            <div class="col-6 mb-3">
              <label>Precio (CLP)</label>
              <input type="number" min="0" class="form-control" id="plan-precio" required>
            </div>
            <div class="col-6 mb-3">
              <label>Duración (días)</label>
              <input type="number" min="1" class="form-control" id="plan-duracion" required>
            </div>
          </div>
          <div class="mb-1">
            <label>Actividades incluidas (separadas por coma)</label>
            <input type="text" class="form-control" id="plan-actividades" placeholder="Musculación, Yoga, Spinning">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-club" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-club">Guardar plan</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/planes.js"></script>
</body>
</html>
